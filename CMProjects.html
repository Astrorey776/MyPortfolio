<style>
   .cncapp-container {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px;
   }
   .cncapp-title {
      color: #f8ca29;
      font-size: 40px;
      font-weight: bold;
      margin-top: 55px;
      margin-bottom: 0px;
      text-align: center;
   }
   .cncapp-byline {
      font-size: 14px;
      color: #666;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
   }
   .cncapp-image {
      width: 40%;
   }
   .cncapp-image img {
      width: 100%;
      height: auto;
   }
   .cncapp-text {
      width: 55%;
      padding-left: 20px;
      margin-top: 0;
      display: center;
      align-items: flex-start;
   }
   .cncapp-extra-text {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
   }
   .technical-data-text{
      margin-top: 15px;
      margin-bottom: 15px;
   }
   .software-images {
      display: flex-start;
      justify-content: space-between;
      text-align: center;
      gap:0px;
      margin-top: 0px;
   }
   .software-images img {
      width: 70px; /* Ajusta el tamaño de las imágenes */
      height: auto;
      transition: transform 0.3s;
   }
   .software-images img:hover {
      transform: scale(1.1); /* Agranda ligeramente al pasar el ratón */
   }

   .see-more-btn {
      text-align: center;
      margin-top: -20px;
      margin-bottom: 30px;
   }

   .see-more-btn button {
      background-color: #f8cb29f7; /* Color amarillo */
      color: white;
      border: none;
      padding: 20px 140px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
   }

   .see-more-btn button:hover {
      background-color: #e5b223; /* Cambia el color al pasar el ratón */
   }

   /* Estilos para la sección desplegable */
   .extra-content {
      display: none;
      margin-top: 20px;
      text-align: center;
      transition: max-height 0.5s ease-in-out;
   }

   .extra-content img {
      width: 100%;
      margin: 10px;
   }

   .extra-content p {
      font-size: 18px;
      margin-top: 10px;
   }

</style>
