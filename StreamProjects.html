   <style>
       /* Estilos para el contenedor del video */
       .video-container {
           position: relative;
           padding-bottom: 30.25%; /* Relación de aspecto 16:9 */
           height: 0;
           overflow: hidden;
           margin: 0 auto;
           max-width: 80%;
           background: #000;
           margin-bottom: 20px; /* Espacio debajo del video */
       }
       .model-row {
    display: flex; /* Flexbox para alinear en fila */
    flex-direction: row; /* Asegura que los elementos estén en fila */
    justify-content: center; /* Centra los visores horizontalmente */
    gap: 40px; /* Espacio entre los visores */
    margin-top: 100px; /* Espaciado superior */
    margin-bottom: 40px; /* Espaciado inferior */
}
       .video-container video {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
       }
       /* Estilos para la fila de imágenes */
       .image-row {
           display: flex;
           flex-direction: row; /* Cambia a fila */
           justify-content: center; /* Centra las imágenes horizontalmente */
           gap: 40px; /* Espacio entre las imágenes */
           margin-bottom: 80px; /* Espacio debajo de la fila de imágenes */
           margin-top: 60px;
       }
       .image-row img {
           width: auto; /* Ajusta automáticamente */
           height: 400px; /* Ajusta a una altura uniforme */
           max-width: 100%; /* Evita que sean más anchas que el contenedor */
           border-radius: 10px; /* Esquinas redondeadas opcionales */
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra suave */
       }
   </style>
