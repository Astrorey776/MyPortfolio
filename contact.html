      <!-- Incluye el script de EmailJS -->
      <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
      <script type="text/javascript">
   (function() {
      emailjs.init("GuejPo4T-bkdr2nfu"); // Sustituye "TU_USER_ID" con el ID que te proporciona EmailJS
   })();
   
   function sendMail(event) {
   event.preventDefault();  // Evita que la página se desplace hacia arriba

   // Obtener los valores de los campos
   var name = document.querySelector('input[name="Your Name"]').value.trim();
   var email = document.querySelector('input[name="Your Email"]').value.trim();
   var message = document.querySelector('textarea[name="Your Message*"]').value.trim();

   // Obtener el elemento del mensaje de error
   var errorMessageElement = document.getElementById('error-message');

   // Verificar si los campos obligatorios están vacíos
   if (!name || !email || !message) {
      errorMessageElement.textContent = "Please complete all required fields: Name, Email and Message.";
      return;  // Salir de la función si falta un campo obligatorio
   }

   // Limpiar el mensaje de error si todos los campos están completos
   errorMessageElement.textContent = '';

   // Si los campos están completos, procede a enviar el correo
   var params = {
      name: name,
      email: email,
      message: message,
   };
   
   emailjs.send("service_gfuh9rf", "template_olth8dk", params)
   .then(function(response) {
      alert("Correo enviado correctamente!");
   }, function(error) {
      alert("Error al enviar el correo: " + JSON.stringify(error));
   });
}
</script>

      <script>
         $('#myCarousel').carousel({
            interval: false
         });
         
         //scroll slides on swipe for touch enabled devices
         
         $("#myCarousel").on("touchstart", function(event){
         
            var yClick = event.originalEvent.touches[0].pageY;
            $(this).one("touchmove", function(event){
         
                var yMove = event.originalEvent.touches[0].pageY;
                if( Math.floor(yClick - yMove) > 1 ){
                    $(".carousel").carousel('next');
                }
                else if( Math.floor(yClick - yMove) < -1 ){
                    $(".carousel").carousel('prev');
                }
            });
            $(".carousel").on("touchend", function(){
                $(this).off("touchmove");
            });
         });
      </script>
