/* === LIGHTBOX === */
.lightbox {
   display: none;
   position: fixed;
   z-index: 9999;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background: rgba(0,0,0,0.85);
   justify-content: center;
   align-items: center;
   opacity: 0;
   transition: opacity 0.3s ease;
}

.lightbox.show {
   display: flex;
   opacity: 1;
}

/* Imagen ampliada */
.lightbox-content {
   max-width: 90%;
   max-height: 90%;
   border-radius: 10px;
   box-shadow: 0 0 20px rgba(0,0,0,0.6);
   transform: scale(0.9);
   opacity: 0;
   transition: transform 0.3s ease, opacity 0.3s ease;
   z-index: 10001;
}

.lightbox.show .lightbox-content {
   transform: scale(1);
   opacity: 1;
}

/* Botón cerrar (X) */
.lightbox-close {
   position: absolute;
   top: 20px;
   right: 40px;
   font-size: 50px;
   font-weight: bold;
   color: #fff;
   cursor: pointer;
   z-index: 10002;
}

/* Flechas navegación */
.lightbox-arrow {
   position: absolute;
   top: 50%;
   transform: translateY(-50%);
   font-size: 50px;
   color: #fff;
   cursor: pointer;
   padding: 10px 15px;
   z-index: 10002;
   user-select: none;
}

.lightbox-prev {
   left: 40px;
}

.lightbox-next {
   right: 40px;
}

.lightbox-arrow:hover,
.lightbox-close:hover {
   color: #f5c729;
}

<script>
   // Abrir imagen grande al hacer clic
   document.querySelectorAll("img").forEach(img => {
      img.addEventListener("click", function () {
         document.getElementById("lightboxImg").src = this.src;
         document.getElementById("lightbox").style.display = "flex";
      });
   });

   // Cerrar al hacer clic en la cruz
   document.getElementById("closeLightbox").addEventListener("click", function (event) {
      event.stopPropagation(); // Evita que cierre inmediatamente por el overlay
      document.getElementById("lightbox").style.display = "none";
   });

   // Cerrar al hacer clic fuera de la imagen
   document.getElementById("lightbox").addEventListener("click", function (e) {
      if (e.target.id === "lightbox") {
         this.style.display = "none";
      }
   });
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {

   // Solo las imágenes de las galerías, no el logo, etc.
   const galleryImages = document.querySelectorAll('.image-grid img, .image-grid2 img');
   const lightbox = document.getElementById('lightbox');
   const lightboxImg = document.getElementById('lightboxImg');
   const closeBtn = document.getElementById('closeLightbox');
   const prevBtn = document.getElementById('prevLightbox');
   const nextBtn = document.getElementById('nextLightbox');

   let currentIndex = 0;

   function openLightbox(index) {
      currentIndex = index;
      const img = galleryImages[currentIndex];
      lightboxImg.src = img.src;
      lightbox.classList.add('show');
   }

   function closeLightbox() {
      lightbox.classList.remove('show');
      // pequeño delay para que acabe la transición antes de ocultar
      setTimeout(() => {
         lightbox.style.display = 'none';
      }, 300);
   }

   function showNext() {
      currentIndex = (currentIndex + 1) % galleryImages.length;
      lightboxImg.src = galleryImages[currentIndex].src;
   }

   function showPrev() {
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      lightboxImg.src = galleryImages[currentIndex].src;
   }

   // Click en miniaturas → abrir lightbox
   galleryImages.forEach((img, index) => {
      img.style.cursor = 'pointer';
      img.addEventListener('click', function () {
         lightbox.style.display = 'flex'; // se necesita antes de la transición
         // pequeño truco para forzar reflow y que la transición funcione
         void lightbox.offsetWidth;
         openLightbox(index);
      });
   });

   // Cerrar con la X
   closeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      closeLightbox();
   });

   // Cerrar al hacer click fuera de la imagen
   lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) {
         closeLightbox();
      }
   });

   // Navegar con flechas
   nextBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      showNext();
   });

   prevBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      showPrev();
   });

   // Teclas: ESC para cerrar, flechas para navegar
   window.addEventListener('keydown', function (e) {
      if (lightbox.classList.contains('show')) {
         if (e.key === 'Escape') {
            closeLightbox();
         } else if (e.key === 'ArrowRight') {
            showNext();
         } else if (e.key === 'ArrowLeft') {
            showPrev();
         }
      }
   });

});
</script>


<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
   <span id="closeLightbox" class="lightbox-close">&times;</span>
   <span id="prevLightbox" class="lightbox-arrow lightbox-prev">&#10094;</span>
   <img id="lightboxImg" class="lightbox-content">
   <span id="nextLightbox" class="lightbox-arrow lightbox-next">&#10095;</span>
